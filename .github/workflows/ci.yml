name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      AZURE_ENABLED: 'false'
      WORKSPACE_EXECUTION_ENABLED: 'false'
    defaults: {run: {working-directory: .}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
      - run: python -m backend.export_openapi
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- lib/api/generated/schema.d.ts
      - run: npm run build
        env:
          # Public, nonfunctional key for build-only CI. Deployment supplies its own Clerk instance.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}
